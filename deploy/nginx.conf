# ---------------------------------------------------------------------------
# 班级作文工作台 · 反向代理（nginx）
# 后端 uvicorn 只监听 127.0.0.1:8000；本配置对外提供 HTTP(S) 入口。
# 前端已由后端静态托管（SPA 挂在 /），故此处只需把全部请求反代给后端。
# ---------------------------------------------------------------------------
upstream essay_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name essay.example.com;   # 改成实际域名

    # 手机原片最大 15MB，multipart 有开销，留足余量（后端仍会二次校验 15MB 上限）。
    client_max_body_size 20m;
    client_body_timeout 120s;

    # 上传/导出可能较慢（OCR 在后台，导出为同步渲染 PDF）。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/essay-workbench.access.log;
    error_log  /var/log/nginx/essay-workbench.error.log;

    location / {
        proxy_pass http://essay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

